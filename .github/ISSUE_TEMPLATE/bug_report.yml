name: Bug Report
description: Report a reproducible problem in hermes-cursor-sdk
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve hermes-cursor-sdk.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Provide exact steps, commands, and inputs.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Package version or commit SHA.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python version, OS, Hermes version, Cursor SDK version.
